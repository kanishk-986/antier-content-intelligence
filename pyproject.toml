[project]
name = "antier-content-intelligence"
version = "0.1.0"
description = "Editorial intelligence engine: market signals to evidence-backed content opportunities for Antier."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.69.0",
  "pyyaml>=6.0",
  "feedparser>=6.0.11",
  "trafilatura>=2.0.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.118.0", "uvicorn>=0.37.0"]
dev = ["pytest>=8.3.0", "ruff>=0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberate selection. Catches real defects and import hygiene; excludes style
# preference. UP031 (%-format), FURB167 (re.I alias) and similar are modernization
# opinions, not bugs -- enabling them turns every review into formatting churn.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes: unused imports/names, undefined names
  "I",    # import sorting
  "B",    # bugbear: real traps (mutable defaults, loop-variable binding)
  "SIM",  # simplifications that reduce branching
  "RUF",  # ruff-specific, incl. unused noqa
]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts prepend sys.path before importing project modules, which E402
# cannot express.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
