# Listing-page rules for sources with no RSS/Atom feed.
#
# Blueprint 41.1: a new source must be addable through configuration without
# changing application code. This file is that configuration -- the extractor's
# heuristics are the default, and these entries override them where a site needs it.
#
# The registry stores a root domain, but press releases live on a news path. Without
# an entry here the extractor probes `default_paths` below; with one, it goes
# straight to the right page.
#
# Keys are matched as a substring of the source URL's host.

default_paths:
  - /news
  - /newsroom
  - /press
  - /press-releases
  - /media
  - /insights
  - /blog
  - /research

# A listing page is an editorial index. If the page that finally answers carries
# none of these stems in its path, it is not one -- blackrock.com/corporate/newsroom
# redirects to /corporate/home, whose "corporate" segment then matched the entire
# site and admitted evergreen marketing. Matched as substrings, so "our-thinking"
# qualifies via "thinking".
editorial_segments:
  - news
  - press
  - media
  - insight
  - blog
  - research
  - publication
  - thinking
  - perspective
  - report
  - article
  - release
  - announce
  - stories
  - viewpoint
  - commentary
  - analysis

# Paths and patterns that are never articles.
reject_patterns:
  - /login
  - /signin
  - /careers
  - /contact
  - /privacy
  - /cookie
  - /legal
  - /terms
  - /sitemap
  - /search
  - /subscribe
  - /events/
  - /tag/
  - /tags/
  - /category/
  - /author/
  - /page/
  - /feed
  # People and section fronts. A sitemap lists the whole site, so these reach the
  # extractor where a newsroom index would never have linked them: DTCC's
  # /press-releases/dtcc-executive-bios/syed-ali is 213 words of biography and
  # clears the 400-character article floor.
  - executive-bios
  - /expert/
  - /experts/
  - /analyst
  - /leadership
  - /our-people
  - /people/
  - /team/
  - /speakers
  - /biography
  - /bios/
  - /content/dam/
  - /assets-shared/
  - /etc.clientlibs/
  - .pdf
  - .zip
  - .xlsx
  - .doc
  - .ppt
  # Image and media assets. A CMS stores them on article-shaped paths -- Deloitte
  # serves /content/dam/.../2025/Our-thinking-....jpg, which carries a year and a
  # hyphenated slug and so passed every other test.
  - .jpg
  - .jpeg
  - .png
  - .gif
  - .svg
  - .webp
  - .mp4
  - .mp3

# Sitemap ingestion (src/ingestion/sitemap.py) is the third path, after feed and
# listing page. It is opt-in per source for the same reason listing paths are: a
# sitemap lists the entire site with no editorial curation behind it, so whether it
# yields articles or section fronts has to be measured, never assumed.
#
# Verified by running the extractor and reading every item:
#   ondo.finance      6/6 real posts, dated      (was js_rendered)
#   circle.com        5/5 pressroom and blog     (was no_feed)
#   statestreet.com   5/6 insights, dated        (was no_feed)
#
# Not enabled, and why:
#   dtcc.com     4/6 — the rest are section fronts and executive bios. Its sitemap
#                is the only machine route it offers, so this is worth revisiting
#                with a path allowlist rather than abandoning.
#   celent.com   3/6 — "Research", "Globaldata Reports" and the homepage all clear
#                the article floor. Needs a per-path rule.
sitemap_sources:
  - ondo.finance
  - circle.com
  - statestreet.com

overrides:
  circle.com:
    listing_paths: [/blog]
    # Circle's blog slugs carry no date; metadata extraction supplies it.
  dtcc.com:
    listing_paths: [/news, /news-and-insights]
  clearstream.com:
    listing_paths: [/clearstream-en/newsroom]
  mastercard.com:
    listing_paths: [/news, /news/press, /insights]
  lseg.com:
    listing_paths: [/en/insights, /en/media-centre/press-releases]
  digitalasset.com:
    listing_paths: [/blog, /news]
  euroclear.com:
    listing_paths: [/newsandinsights]
    note: measured HTTP 403 on the root; listing may also block
  # Added after probing with scripts/probe_listing.py, then verified by running the
  # extractor. News and press paths only: these firms' /insights pages are evergreen
  # service and thought-leadership hubs ("Agentic AI in M&A | Transaction Advisory"),
  # which is the marketing content section 2.2 keeps out of the corpus.
  worldbank.org:
    listing_paths: [/en/news]
  ey.com:
    listing_paths: [/us/en/newsroom, /newsroom]
  kpmg.com:
    listing_paths: [/news]
  # Not added, and why:
  #   blackrock.com  - /corporate/newsroom redirects to the homepage; the links
  #                    there are evergreen marketing, not dated news.
  #   cadwalader.com - /press-releases redirects off-domain to hlc.com.
  #   jpmorgan.com, accenture.com, nielseniq.com - only /insights resolves, which
  #                    is a thought-leadership hub, not news (section 2.2).
